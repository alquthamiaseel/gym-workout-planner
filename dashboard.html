<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gym Workout Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-blue-600 text-white p-4">
        <h1 class="text-xl">Gym Workout Planner</h1>
        <nav class="mt-2">
            <a href="index.html" class="mr-4 hover:underline">Home</a>
            <a href="create_profile.html" class="mr-4 hover:underline">Create Profile</a>
            <a href="suggest_workout_plan.html" class="mr-4 hover:underline">Suggest Workout Plan</a>
            <a href="track_workouts.html" class="mr-4 hover:underline">Track Workouts</a>
            <a href="set_reminders.html" class="hover:underline">Set Reminders</a>
        </nav>
    </header>
    <main class="p-4">
        <h2 class="text-2xl mb-4">Your Progress Dashboard</h2>
        <p>This section shows your weekly workout progress.</p>
        <div class="border p-4 mb-4">
            <h3 class="font-bold">Weekly Summary</h3>
            <p>Workouts Completed: 4</p>
            <p>Total Workout Time: 5 hours</p>
            <p>Average Heart Rate: 125 bpm</p>
        </div>
        <button class="bg-blue-600 text-white p-2">View Detailed Progress</button>
    </main>
</body>
</html>
