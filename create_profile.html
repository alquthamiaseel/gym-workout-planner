<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile - Gym Workout Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-blue-600 text-white p-4">
        <h1 class="text-xl">Gym Workout Planner</h1>
        <nav class="mt-2">
            <a href="index.html" class="mr-4 hover:underline">Home</a>
            <a href="suggest_workout_plan.html" class="mr-4 hover:underline">Suggest Workout Plan</a>
            <a href="track_workouts.html" class="mr-4 hover:underline">Track Workouts</a>
            <a href="set_reminders.html" class="mr-4 hover:underline">Set Reminders</a>
            <a href="dashboard.html" class="hover:underline">Dashboard</a>
        </nav>
    </header>
    <main class="p-4">
        <h2 class="text-2xl mb-4">Create Your Profile</h2>
        <form>
            <label for="goal" class="block mb-2">Fitness Goal:</label>
            <input type="text" id="goal" class="border p-2 mb-4 w-full" placeholder="e.g., Lose weight, Build muscle">
            <label for="frequency" class="block mb-2">Workout Frequency:</label>
            <input type="text" id="frequency" class="border p-2 mb-4 w-full" placeholder="e.g., 3 times a week">
            <label for="experience" class="block mb-2">Experience Level:</label>
            <select id="experience" class="border p-2 mb-4 w-full">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
            <button type="submit" class="bg-blue-600 text-white p-2">Create Profile</button>
        </form>
    </main>
</body>
</html>
